appId: com.sidekick.v2
name: 'P04-43 — Skills menu: Documents chip starts building, demands no credential'
tags:
  - persona:P04
  - skills
  - skills-live
# blocked-reason: retired: tests Hermes skills and commands, gone with the runners on 2026-09-18
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "home.chatPanel"
    timeout: 30000
- tapOn:
    id: "main-menu-button"
- tapOn:
    id: "menu.skillsRow"
- tapOn:
    id: "skills.category.docs"
- takeScreenshot: "skills-docs-01-category"
- tapOn:
    id: "skills.category.docs.try"
- extendedWaitUntil:
    visible:
      text: ".*write me a report.*"
    timeout: 15000
- takeScreenshot: "skills-docs-02-phrase-sent"
# Build-now contract: report-writer must open with intake (topic, audience,
# format), never a credential detour. Vocabulary avoids "report", which the
# echoed phrase already contains.
- extendedWaitUntil:
    visible:
      text: ".*(topic|audience|format|length|what.*(cover|about)).*"
    timeout: 120000
- assertNotVisible:
    text: ".*(API key|OAuth|client (id|secret)|developer console).*"
- assertNotVisible:
    text: ".*(skill.{0,24}not (found|available)|doesn.t exist|not in the current environment).*"
- takeScreenshot: "skills-docs-03-reply"
