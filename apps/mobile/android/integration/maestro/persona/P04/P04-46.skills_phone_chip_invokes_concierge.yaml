appId: com.sidekick.v2
name: 'P04-46 — Skills menu: Phone chip invokes the Twilio concierge (credential-first)'
tags:
  - persona:P04
  - skills
  - skills-live
# blocked-reason: retired: tests Hermes skills and commands, gone with the runners on 2026-09-18
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "home.chatPanel"
    timeout: 30000
- tapOn:
    id: "main-menu-button"
- tapOn:
    id: "menu.skillsRow"
- tapOn:
    id: "skills.category.phone"
- takeScreenshot: "skills-phone-01-category"
- tapOn:
    id: "skills.category.phone.try"
- extendedWaitUntil:
    visible:
      text: ".*set up a phone line.*"
    timeout: 15000
- takeScreenshot: "skills-phone-02-phrase-sent"
# Routing regression pinned live: on 2026-08-03 this phrase scored highest on
# agent-email-inbox. The reply must talk numbers and calls, not inboxes.
# Vocabulary avoids "phone" and "line", which the echoed phrase contains.
- extendedWaitUntil:
    visible:
      text: ".*(Twilio|number|country|calls|receptionist|voicemail).*"
    timeout: 120000
- assertNotVisible:
    text: ".*(skill.{0,24}not (found|available)|doesn.t exist|not in the current environment).*"
- takeScreenshot: "skills-phone-03-reply"
