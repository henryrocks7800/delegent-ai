appId: com.sidekick.v2
name: P04-11 — Files tab shows the seeded workspace directories
tags:
  - persona:P04
  - files
# blocked-reason: retired: the Files drawer went with the runners on 2026-09-18
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "home.chatPanel"
    timeout: 30000
- tapOn:
    id: "tab.artifacts"
- extendedWaitUntil:
    visible:
      id: "files.runnerFileList"
    timeout: 15000
- tapOn:
    id: "files.refreshButton"
- waitForAnimationToEnd:
    timeout: 6000
- assertVisible:
    text: ".*HOME.*|.*NOTES.*|.*PICTURES.*|.*DOWNLOADS.*"
