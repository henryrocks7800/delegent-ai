appId: com.sidekick.v2
name: P01-03 — Empty / whitespace agent name does not save
tags:
  - persona:P01
  - onboarding
  - unhappy-path
# blocked-reason: needs a signed-in account that has not finished onboarding; the test account the pack signs in has
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "onboarding.agentNameInput"
    timeout: 30000
- tapOn:
    id: "onboarding.agentNameInput"
- inputText: "   "
# Try to advance; button should be disabled OR validation should keep us here.
- runFlow:
    when:
      visible:
        id: "onboarding.finishButton"
    commands:
      - tapOn:
          id: "onboarding.finishButton"
# We must still be on the onboarding screen.
- assertVisible:
    id: "onboarding.agentNameInput"
- assertNotVisible:
    id: "home.chatPanel"
