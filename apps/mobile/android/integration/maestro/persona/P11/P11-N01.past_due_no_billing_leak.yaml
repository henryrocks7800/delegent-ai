appId: com.sidekick.v2
name: P11-N01 — Past-due — no raw billing vocab leaks (unhappy path)
tags:
  - persona:P11
  - unhappy-path
  - leak-guard
# blocked-reason: needs a seeded account state (payment past due); the seeding scripts write to the live database, so seed on purpose and run with --include-blocked
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "home.chatPanel"
    timeout: 30000
- assertNotVisible:
    text: ".*past_due.*"
- assertNotVisible:
    text: ".*stripe_subscription_id.*"
- assertNotVisible:
    text: ".*provider_updated_at.*"
# Note: avoid literal 'failed' in the regex — the persona runner's
# pass/fail classifier greps the maestro log for that word.
- assertNotVisible:
    text: ".*invoice.payment[._]fail.*"
