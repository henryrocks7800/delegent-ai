appId: com.sidekick.v2
name: P11-01 — Past-due dunning surface visible
tags:
  - persona:P11
  - billing
  - past-due
# blocked-reason: needs a seeded account state (payment past due); the seeding scripts write to the live database, so seed on purpose and run with --include-blocked
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "home.chatPanel"
    timeout: 30000
# Either the chat works (past_due is still entitled) or a dunning
# banner is shown. We allow both — the contract is the user is NOT
# blocked from chat during dunning.
- assertVisible:
    id: "home.chatPanel.input"
