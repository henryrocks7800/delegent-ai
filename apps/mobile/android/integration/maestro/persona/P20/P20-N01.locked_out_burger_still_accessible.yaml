appId: com.sidekick.v2
name: P20-N01 — Locked-out at quota — burger menu still navigable (unhappy path)
tags:
  - persona:P20
  - unhappy-path
  - quota
  - navigation
# blocked-reason: needs a seeded account state (over the monthly allowance); the seeding scripts write to the live database, so seed on purpose and run with --include-blocked
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "home.chatPanel"
    timeout: 30000
# Even while over-quota, the burger menu must remain usable so the
# user can navigate to Plan & billing to upgrade.
- tapOn:
    id: "main-menu-button"
- extendedWaitUntil:
    visible:
      id: "menu.setupGuideRow"
    timeout: 4000
- assertVisible:
    id: "menu.setupGuideRow"
- assertVisible:
    id: "menu.capacityRow"
# Close drawer for next flow.
- tapOn:
    id: "drawer.backdropDismiss"
