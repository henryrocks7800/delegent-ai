appId: com.sidekick.v2
name: P07-01 — Near-quota banner visible at 85% usage
tags:
  - persona:P07
  - quota
  - near-limit
# blocked-reason: needs a seeded account state (near the monthly allowance); the seeding scripts write to the live database, so seed on purpose and run with --include-blocked
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "home.chatPanel"
    timeout: 30000
# Near-limit on home surfaces as a header status badge ("Busy month")
# and the capacity bar colours warning. The composer is NOT blocked
# (only hardLimited blocks). Assert composer remains usable and the
# over-quota banner is NOT shown.
- assertVisible:
    id: "home.chatPanel.input"
- assertNotVisible:
    text: ".*used this month's.*capacity.*"
