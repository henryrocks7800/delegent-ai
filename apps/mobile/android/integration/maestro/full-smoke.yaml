    text: "Files"
    optional: true
- takeScreenshot: "maestro-full-03-files"
- tapOn:
    text: "Profile"
    optional: true
- takeScreenshot: "maestro-full-04-profile"
- tapOn:
    text: "Home"
    optional: true
- takeScreenshot: "maestro-full-05-home"
