appId: com.sidekick.v2
name: Production - home chat send + reply
---
# The whole round trip: a message typed and sent appears as the person's own
# bubble at once, and the coworker's reply arrives. The message asks for one
# known word, so the reply can be recognised without guessing its wording.
#
# 2026-09-28: rewritten for the WebView chat (element ids input and sendBtn).
# The pack no longer wipes the account's chat history first: that worked
# round a list-virtualisation bug in the native chat of May, deleted rows in
# the live database, and the WebView chat has no such list.
- launchApp:
    clearState: false
- runFlow: _signed_in_ready.yaml
- tapOn:
    id: "input"
- inputText: "Reply with only the word PINEAPPLE."
- takeScreenshot: "production_home_chat_send_text_message_01_typed"
- tapOn:
    id: "sendBtn"
- extendedWaitUntil:
    visible:
      text: "Reply with only the word PINEAPPLE\\."
    timeout: 15000
- takeScreenshot: "production_home_chat_send_text_message_02_sent"
- extendedWaitUntil:
    visible:
      text: "(?i)\\W*pineapple\\W*"
    timeout: 120000
- takeScreenshot: "production_home_chat_send_text_message_03_reply"
- assertNotVisible:
    text: "service role|runner URL|raw provider"
- assertNotVisible:
    text: "Your coworker is getting ready|Coming online|workspace is preparing|workspace is not ready"
