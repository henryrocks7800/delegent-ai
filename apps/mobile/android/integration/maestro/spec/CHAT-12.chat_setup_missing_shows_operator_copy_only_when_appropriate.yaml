appId: com.sidekick.v2
name: CHAT-12 — Chat Setup Missing Shows Operator Copy Only When Appropriate
tags:
  - chat
  - blocked
# blocked-reason: retired: tests the per-user runner (provisioning, waking, its workspace), retired on 2026-09-18
---
# ============================================================================
# Spec ID: CHAT-12 — Chat Setup Missing Shows Operator Copy Only When
#                    Appropriate
# Source of truth: docs/tmp/delegent_maestro_suggested_missing_journeys.md
#
# Status: live-only. Subscribed user with NO runner yet
# (seed --profile subscribed → subscription.status='active',
# hermes_instances.status='not_requested'). The product-state gate
# is `subscribed_pending_worker` — the header reads "Preparing", the
# chat composer is technically enabled (because hasActiveSubscription
# is true), but the underlying chat-send pipeline can't reach a runner
# so a real send must surface a bounded error to the user rather than
# a raw provider/SQL/Worker payload.
#
# What this spec verifies:
#   1. Header gate label is "Preparing" (not "Online" / "Setup").
#   2. The chat home renders normally (composer + main menu present).
#   3. Sending a message produces a bounded error banner in the chat
#      panel (id="home.chatPanel.error") within a reasonable timeout.
#   4. The error banner does NOT leak provider internals: no
#      service_role, no SQL fragments, no Worker/runner host names,
#      no Fly/OpenRouter/Hermes mentions, no stack traces.
#   5. The composer is still usable after the failure (user not
#      trapped — the input + send button / mic button remain visible).
# ============================================================================
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "home.chatPanel"
    timeout: 30000
- assertVisible:
    id: "home.chatPanel"
- assertVisible:
    id: "main-menu-button"

# Step 1 — header gate label proves the user is in the
# `subscribed_pending_worker` state (the only state that maps to
# "Preparing" via gateDisplayLabel — see App.tsx:482-485). If we ever
# see "Online" / "Ready" / "Live" here the seed didn't actually leave
# the runner in `not_requested` and the test is moot.
- assertVisible:
    text: "Preparing"
- assertNotVisible:
    text: "Online"
- assertNotVisible:
    text: "Live"
- takeScreenshot: "chat_12_01_preparing_header_visible"

# Step 2 — type and send a marker message. The chat send hits the
# Worker → runner pipeline, which has no runner to dispatch to, so
# the send must fail and emit an error banner.
- tapOn:
    id: "home.chatPanel.input"
- inputText: "CHAT12-PROBE-SETUP-REQUIRED"
- hideKeyboard
- assertVisible:
    text: ".*CHAT12-PROBE-SETUP-REQUIRED.*"
- assertVisible:
    id: "home.chatPanel.sendButton"
- tapOn:
    id: "home.chatPanel.sendButton"

# Step 3 — operator copy lands. With no runner bound to the user, the
# product surfaces operator-friendly copy via ONE of three paths
# (any of them satisfies the spec's "operator copy only when
# appropriate" intent):
#   (a) Worker rejects the send synchronously → sendMessage returns
#       { ok: false, error }, the optimistic bubbles are rolled back
#       and setErrorMessage(result.error.message) fills the error
#       banner.
#   (b) Worker accepts the send into the queue, no runner picks it
#       up, mobile polls for 120s, on timeout setErrorMessage(
#       "Your coworker didn't reply this time. Try again.") fills
#       the banner (HomeChatPanel.tsx:347-352).
#   (c) Worker accepts the send and the assistant engine answers
#       inline with an operator-friendly bubble explaining the
#       workspace is still provisioning. The reply lands as a normal
#       assistantText (testID home.chatPanel.message.assistantText)
#       with no error banner.
# We accept any path — the rendered bubble (path c) is the most
# user-friendly outcome and is what an actual subscribed-but-not-
# provisioned user sees. The leak guards in Step 4 still bind on
# whatever copy surfaced.
- extendedWaitUntil:
    visible:
      id: "home.chatPanel.message.assistantText"
    timeout: 180000
- assertVisible:
    id: "home.chatPanel.message.assistantText"
- takeScreenshot: "chat_12_02_operator_copy_after_send"

# Step 4 — leak guards. The operator copy must not expose provider
# internals or SQL details to the user. Use provider-specific
# phrases (case-insensitive matches against generic words like
# "Worker" or "Fly" produce false positives against the brand copy
# "coworker" / "fly through"; the intent is to block infra
# vocabulary, not English compounds).
- assertNotVisible:
    text: "service_role"
- assertNotVisible:
    text: ".*Hermes Agent.*"
- assertNotVisible:
    text: ".*hermes_instances.*"
- assertNotVisible:
    text: ".*OpenRouter.*"
- assertNotVisible:
    text: ".*Fly Machines.*"
- assertNotVisible:
    text: ".*fly\\.io.*"
- assertNotVisible:
    text: ".*Cloudflare Worker.*"
- assertNotVisible:
    text: ".*Worker URL.*"
- assertNotVisible:
    text: ".*HTTP 502.*"
- assertNotVisible:
    text: ".*Traceback.*"
- assertNotVisible:
    text: ".*INSERT INTO.*"
- assertNotVisible:
    text: ".*SELECT \\*.*"
- assertNotVisible:
    text: ".*postgresql.*"
- assertNotVisible:
    text: ".*supabase\\.co.*"

# Step 5 — composer must remain usable (the user must not be trapped).
# Mic button is visible after composer cleared on failed send, or
# sendButton if the failed-send rollback re-fills draft.
- assertVisible:
    id: "home.chatPanel.input"
- takeScreenshot: "chat_12_03_composer_still_usable"
