# **Status:** Manifest covers deep-link returns generally; keep this as a hard cancel-state flow.
# 
# **Precondition:** Authenticated, onboarded, unsubscribed user in checkout confirming state.
# 
# **Flow and assertions:**
# 
# 1. **Screen: plan picker → checkout**
#    - Start checkout.
# 2. **Screen: Stripe/browser cancel**
#    - Return via `sidekick://checkout/cancel` or configured cancel return.
# 3. **Screen: app after cancel**
#    - Assert no thank-you banner.
#    - Assert no “active plan” claim.
#    - Assert plan picker remains available.
# 
# **Backend/provider assertions:**
# 
# - Subscription remains inactive.
# - No provisioning job is created from cancel-only return.
