appId: com.sidekick.v2
name: MENU-11 — Monthly Capacity Hard Limit Explains Pause
tags:
  - menu
  - blocked
# blocked-reason: retired: the Monthly capacity page went with the agent engine; its numbers are the Monthly allowance card on Plan & billing, checked by production/menu.capacity_page.yaml
---
# ============================================================================
# Spec ID: MENU-11 — Monthly Capacity Hard Limit Explains Pause
# Source of truth: docs/tmp/delegent_maestro_suggested_missing_journeys.md
#
# Status: live-only. Active subscriber pushed past the monthly token
# quota (seed --profile ready-runner --usage hard-limited; ~115%).
# The CapacityDrawer shows the "Full" status label, danger-tone
# styling, the "used everything" copy, and the Manage plan CTA
# prominent.
# ============================================================================
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "home.chatPanel"
    timeout: 15000

# Open menu → Monthly capacity
- tapOn:
    id: "main-menu-button"
- extendedWaitUntil:
    visible:
      id: "menu.homeRow"
    timeout: 8000
- scrollUntilVisible:
    element:
      id: "menu.capacityRow"
    direction: DOWN
    timeout: 8000
- tapOn:
    id: "menu.capacityRow"
- extendedWaitUntil:
    visible:
      text: "Monthly capacity"
    timeout: 8000
- takeScreenshot: "menu_11_01_hard_limit_capacity"

# Hard-limited status label
- assertVisible:
    text: "Full"
- assertVisible:
    text: "Studio"

# Manage plan CTA
- assertVisible:
    text: ".*Manage plan.*"

# Comfortable / near-limit copy must NOT appear
- assertNotVisible:
    text: "Plenty of room"
- assertNotVisible:
    text: "Getting busy"

- assertNotVisible:
    text: "service_role"
