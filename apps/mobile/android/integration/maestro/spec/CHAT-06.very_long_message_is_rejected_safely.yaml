appId: com.sidekick.v2
name: CHAT-06 — Very Long Message Is Rejected Safely
tags:
  - chat
  - live-only
---
# ============================================================================
# Spec ID: CHAT-06 — Very Long Message Is Rejected Safely
# Source of truth: docs/tmp/delegent_maestro_suggested_missing_journeys.md
#
# Status: live-only. Subscribed user on chat home (seed --profile
# ready-runner). The chat input is capped at maxLength={8000}
# (HomeChatPanel.tsx:612). This spec proves the contract the user
# actually observes — the composer remains responsive to a non-trivial
# message, takes multiple discrete typing bursts, the send button
# enables, and no provider-internal copy leaks.
#
# Why this spec does NOT type 8000 chars to prove the cap-firing edge:
# Maestro's Android inputText path drives the native EditText one
# character at a time via UiAutomator setText, and React Native's
# controlled TextInput re-renders on every onChangeText. Measured on
# this emulator at ~140ms/char, 8000 chars takes ~19 minutes per run,
# which is impractical for the release-gate filter. The cap-firing
# bound is enforced by React Native's primitive maxLength prop, which
# is covered by the platform's own test suite and by a TypeScript
# source-level guarantee in the build. The test below covers the
# composer-stays-responsive half of the spec contract; the cap-firing
# half is documented in BATCH-4-REPORT.md as deferred to a future
# fixture (testID-exposed draft.length status line, or paste-via-
# clipboard once `cmd clipboard set` is available on the emulator
# image — currently disallowed: "No shell command implementation").
# ============================================================================
- launchApp:
    clearState: false
- runFlow: ../production/_signed_in_ready.yaml
- extendedWaitUntil:
    visible:
      id: "input"
    timeout: 15000
- tapOn:
    id: "input"

# Step 1 — type a marker + a chunk + a marker (around 65 chars total
# — fast, ~10s). The composer is exercised by multiple discrete
# inputText calls. Use regex matches() semantics on the assert
# because the EditText content is one long-ish node.
- inputText: "STARTM"
- inputText: "_filler_content_for_a_non_trivial_message_payload_"
- inputText: "ENDXX"
- hideKeyboard
- takeScreenshot: "chat_06_01_after_input"

- assertVisible:
    text: ".*STARTM.*"
- assertVisible:
    text: ".*ENDXX.*"

# Step 2 — composer is not frozen: input is still rendered, the send
# button toggle is showing (draft is non-empty), and the input still
# accepts further keystrokes after the burst.
- assertVisible:
    id: "input"
- assertVisible:
    id: "sendBtn"
- tapOn:
    id: "input"
- inputText: "TAIL"
- hideKeyboard
- assertVisible:
    text: ".*TAIL.*"
- takeScreenshot: "chat_06_02_composer_still_responsive"

# Step 3 — no provider internals or error text leaked anywhere on the
# chat surface as a result of the long-ish paste.
- assertNotVisible:
    text: "service_role"
- assertNotVisible:
    text: "stack trace"
- assertNotVisible:
    text: "Traceback"
