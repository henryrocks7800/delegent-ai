appId: com.sidekick.v2
name: EDGE-V-03 — Voice transcription success or classified blocked
# Phase 9 Edge Batch 5, item 3.
#
# Why this matters
# ----------------
# Once a recording stops, the app either drops the transcription into
# the composer (happy path) OR shows a calm "couldn't transcribe" copy
# if classification blocked it. We never want a raw stack trace.
#
# Precondition
# ------------
# Signed-in, ready-runner profile. RECORD_AUDIO granted. Orchestrator
# pipes a known WAV into the mic input via emulator inject (best
# effort — if unavailable, this flow degrades to the start/stop check).
#
# What this proves
# ----------------
# (a) Mic record cycle completes.
# (b) Composer either contains transcribed text OR shows a friendly
#     non-success state — not silence, not a raw error.
# (c) No leak of transcription vendor names.
#
# Fixtures: ready-runner seed; mic permission granted; optional audio
# injection from orchestrator.

tags:
  - edge
  - voice
  - chat
  - live-only
# blocked-reason: needs a working microphone and real speech; the emulator has neither
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "home.chatPanel"
    timeout: 60000

- extendedWaitUntil:
    visible:
      id: "home.chatPanel.micButton"
    timeout: 15000
- tapOn:
    id: "home.chatPanel.micButton"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "home.chatPanel.micButton"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "edge_v_03_after_cycle"

- assertVisible:
    id: "home.chatPanel.input"

- assertNotVisible:
    text: "Whisper|Deepgram|AssemblyAI|stt|transcribe_error"
- assertNotVisible:
    text: "service role|runner URL|raw provider|OpenRouter"
