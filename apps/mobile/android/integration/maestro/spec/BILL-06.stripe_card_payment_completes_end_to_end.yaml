#    - Tap Open secure checkout.
# 2. **Screen: hosted Stripe Checkout**
#    - Assert Card/Visa payment method is visible.
#    - Enter Stripe test card and complete payment.
# 3. **Screen: app return**
#    - Assert thank-you banner appears only after webhook-backed state.
#    - Assert Chat home is visible.
# 4. **Screen: relaunch**
#    - Relaunch app.
#    - Assert returning subscriber bypasses login and plan picker.
# 
