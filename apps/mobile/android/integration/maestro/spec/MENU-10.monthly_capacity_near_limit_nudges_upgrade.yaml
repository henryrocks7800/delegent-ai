appId: com.sidekick.v2
name: MENU-10 — Monthly Capacity Near Limit Nudges Upgrade
tags:
  - menu
  - blocked
# blocked-reason: retired: the Monthly capacity page went with the agent engine; its numbers are the Monthly allowance card on Plan & billing, checked by production/menu.capacity_page.yaml
---
# ============================================================================
# Spec ID: MENU-10 — Monthly Capacity Near Limit Nudges Upgrade
# Source of truth: docs/tmp/delegent_maestro_suggested_missing_journeys.md
#
# Status: live-only. Active subscriber pushed to ~92% of the monthly
# token quota (seed --profile ready-runner --usage near-limit). The
# CapacityDrawer surfaces the "Getting busy" / "approaching this
# month's capacity" warning copy, the "Busy month" status badge,
# and a primary Manage plan & payment CTA.
# ============================================================================
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "home.chatPanel"
    timeout: 15000

# Open the drawer and tap Monthly capacity
- tapOn:
    id: "main-menu-button"
- extendedWaitUntil:
    visible:
      id: "menu.homeRow"
    timeout: 8000
- scrollUntilVisible:
    element:
      id: "menu.capacityRow"
    direction: DOWN
    timeout: 8000
- tapOn:
    id: "menu.capacityRow"

- extendedWaitUntil:
    visible:
      text: "Monthly capacity"
    timeout: 8000
- takeScreenshot: "menu_10_01_near_limit_capacity"

# Near-limit warning surfaces
- assertVisible:
    text: "Getting busy"
- assertVisible:
    text: "Studio"

# Manage plan CTA renders
- assertVisible:
    text: ".*Manage plan.*"

# Comfortable / hard-limited copy must NOT appear
- assertNotVisible:
    text: "Plenty of room"
- assertNotVisible:
    text: "used everything"

- assertNotVisible:
    text: "service_role"
